<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas-Profi DE - Segmentierung</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <style>
        /* Дополнительные стили для главной страницы (плашки) */
        .brand-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .brand-card {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 120px;
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            color: white;
            text-decoration: none;
        }

        .brand-card:active {
            transform: scale(0.96);
        }

        /* Цвета брендов на главной */
        .card-viessmann { background-color: #e2001a; }
        .card-vaillant { background-color: #008f7a; }
        .card-buderus { background-color: #003366; }
        .card-broetje { background-color: #6d6e71; border-bottom: 5px solid #e30613; }
        
        .card-rechner { 
            background-color: var(--primary-color); 
            margin-top: 10px;
            border: 2px dashed var(--accent-color);
        }

        .welcome-text {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1 style="margin: 0;">Gas-Profi DE</h1>
    <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
</header>

<div class="container">
    <div class="welcome-text">
        <h2>Technisches Handbuch</h2>
        <p>Wählen Sie eine Marke oder nutzen Sie den Einheitenrechner</p>
    </div>

    <div class="brand-grid">
        <!-- Viessmann -->
        <a href="viessmann.html" class="brand-card card-viessmann">
            Viessmann
        </a>

        <!-- Vaillant -->
        <a href="vaillant.html" class="brand-card card-vaillant">
            Vaillant
        </a>

        <!-- Buderus -->
        <a href="buderus.html" class="brand-card card-buderus">
            Buderus
        </a>

        <!-- Brötje -->
        <a href="broetje.html" class="brand-card card-broetje">
            Brötje
        </a>

        <!-- Rechner -->
        <a href="rechner.html" class="brand-card card-rechner">
            ⚙️ Einheitenrechner
        </a>
    </div>

    <footer style="margin-top: 50px; text-align: center; font-size: 0.8rem; opacity: 0.6;">
        <p>© 2026 Gas-Profi DE | Offline-Modus aktiv</p>
    </footer>
</div>

<button id="backToTop" title="Nach oben">↑</button>

<script src="script.js"></script>
</body>
</html>
